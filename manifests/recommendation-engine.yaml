apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-engine
  namespace: cost-demo
  labels:
    team: personalization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-engine
  template:
    metadata:
      labels:
        app: recommendation-engine
    spec:
      containers:
      - name: recommendation-engine
        image: polinux/stress
        command: ["/bin/sh", "-c"]
        args: ["while true; do stress --cpu 2 --timeout 120s; sleep 120; done"]
        resources:
          requests:
            cpu: "2"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "1Gi"
      restartPolicy: Always
